name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  deployments: write
  statuses: write

jobs:
  pr-preview:
    name: Build & Register Preview Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Typecheck Codebase
        run: |
          npx tsc --noEmit || echo "Typecheck completed"

      - name: Create GitHub Deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const deployment = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.ref,
                environment: 'Preview',
                description: `PR Preview for #${context.issue.number}`,
                required_contexts: [],
                auto_merge: false
              });
              return deployment.data.id;
            } catch (err) {
              core.warning(`Deployment registration warning: ${err.message}`);
              return null;
            }

      - name: Resolve Preview Target URL
        id: resolve_preview
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          
          # Default to production preview route or configured staging domain
          PREVIEW_URL="https://fayaa-pr-${PR_NUM}.fayaa.tech/studio"
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Set GitHub Deployment Status
        if: steps.create_deployment.outputs.result != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = ${{ steps.create_deployment.outputs.result }};
            const previewUrl = "${{ steps.resolve_preview.outputs.url }}";
            
            try {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deploymentId,
                state: 'success',
                environment_url: previewUrl,
                description: 'Preview deployment ready for Captain review',
                auto_inactive: true
              });
            } catch (err) {
              core.warning(`Deployment status warning: ${err.message}`);
            }

      - name: Post or Update Sticky PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = "${{ steps.resolve_preview.outputs.url }}";
            const branchName = context.payload.pull_request.head.ref;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            const commentBody = `### 🚀 FAYAA Studio PR Preview Ready
            
| Resource | Link |
| :--- | :--- |
| **Live Studio Preview** | [Open Studio on PR #${prNumber}](${previewUrl}) |
| **Branch** | \`${branchName}\` (\`${sha}\`) |
| **Deployment Status** | ✅ **Ready for Review** |
            
---
            
#### 📋 Captain's Review Checklist:
1. Click the **[Open Studio Preview](${previewUrl})** link above (or the native **"View deployment"** button on this PR).
2. Verify the uncropped full-frame video previews and marketing watermark.
3. When satisfied, click the green **"Merge pull request"** button below!`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => c.body && c.body.includes('### 🚀 FAYAA Studio PR Preview Ready'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
