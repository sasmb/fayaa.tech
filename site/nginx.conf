# nginx for the static marketing site. App paths (APP_PATHS / APP_PREFIXES in
# src/lib/appPaths.mjs) redirect to the app with the query string kept;
# tests/redirects.check.mjs checks the two lists match.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # www -> apex
  if ($host = www.fayaa.tech) { return 301 https://fayaa.tech$request_uri; }

  location = /healthz { access_log off; return 200 "ok"; }

  # Old sitemap URL (already submitted to Search Console).
  location = /sitemap.xml { return 301 /sitemap-index.xml; }

  # App pages moved to app.fayaa.tech.
  location = /studio { return 301 https://app.fayaa.tech$request_uri; }
  location = /login { return 301 https://app.fayaa.tech$request_uri; }
  location = /signup { return 301 https://app.fayaa.tech$request_uri; }
  location = /account { return 301 https://app.fayaa.tech$request_uri; }
  location = /checkout { return 301 https://app.fayaa.tech$request_uri; }
  location = /request-password-reset { return 301 https://app.fayaa.tech$request_uri; }
  location = /password-reset { return 301 https://app.fayaa.tech$request_uri; }
  location = /email-verification { return 301 https://app.fayaa.tech$request_uri; }
  location = /file-upload { return 301 https://app.fayaa.tech$request_uri; }
  location = /admin { return 301 https://app.fayaa.tech$request_uri; }
  location = /terms { return 301 https://app.fayaa.tech$request_uri; }
  location = /privacy { return 301 https://app.fayaa.tech$request_uri; }
  location = /refunds { return 301 https://app.fayaa.tech$request_uri; }
  location ^~ /admin/ { return 301 https://app.fayaa.tech$request_uri; }
  location ^~ /api/ { return 301 https://app.fayaa.tech$request_uri; }
  location ^~ /auth/ { return 301 https://app.fayaa.tech$request_uri; }
  location ^~ /operations/ { return 301 https://app.fayaa.tech$request_uri; }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Clean URLs: /pricing -> pricing.html; strip trailing slashes.
  location / {
    rewrite ^(.+)/$ $1 permanent;
    add_header Cache-Control "public, max-age=300";
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
}
